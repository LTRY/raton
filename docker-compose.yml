services:
  db:
    container_name: raton-db
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: raton
      POSTGRES_USER: raton
      # Only read when the volume is first initialised; changing it later does not rename the role's password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raton}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raton -d raton"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The API (`back/`): the only container with the database, the media volume and the secrets.
  # No published port: the front relays `/api/*` to it on the Compose network.
  api:
    container_name: raton-api
    image: ${RATON_API_IMAGE:-raton-api:local}
    build:
      context: .
      target: back
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${MEDIA_HOST_ROOT:-./.local/media/YouTube}:/media/youtube
      # The journal survives the container recreation of every deploy (spec 13, "Journal applicatif").
      - ${LOG_HOST_DIR:-./.local/logs}:/var/log/raton
    environment:
      LOG_DIR: /var/log/raton
      DATABASE_URL: postgresql+psycopg://raton:${POSTGRES_PASSWORD:-raton}@db:5432/raton
      MEDIA_ROOT: /media/youtube
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-3.5}
      RERANK_MODEL: ${RERANK_MODEL:-rerank-2.5}
      # The browser's writes come through the front with its Host: the same-origin check of the
      # back compares against it.
      APP_TRUSTED_ORIGINS: ${APP_TRUSTED_ORIGINS:-}

  # The pages (`front/`): no database, no media, no secret; it calls the API over HTTP.
  app:
    container_name: raton
    image: ${RATON_IMAGE:-raton:local}
    build:
      context: .
      target: front
    depends_on:
      - api
    ports:
      # Loopback only: the app has no authentication. Set APP_BIND=0.0.0.0 to open it to a trusted LAN.
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    environment:
      RATON_API_URL: http://api:8001
      APP_TRUSTED_ORIGINS: ${APP_TRUSTED_ORIGINS:-}

  # The MCP server (`mcp_server/`): another client of the API, like the front; read-only tools.
  mcp:
    container_name: raton-mcp
    image: ${RATON_MCP_IMAGE:-raton-mcp:local}
    build:
      context: .
      target: mcp
    depends_on:
      - api
    ports:
      # Loopback only: the MCP server has no authentication. Set MCP_BIND=0.0.0.0 to open it to a trusted LAN.
      - "${MCP_BIND:-127.0.0.1}:8002:8002"
    environment:
      RATON_API_URL: http://api:8001
      MCP_TRANSPORT: streamable-http

  # The operations container (`make previews`): the previews page and the deploy of main. Root with the Docker socket on purpose: it drives the host's Docker. Behind a
  # profile so that `make up` (and so a deploy it runs itself) never recreates it mid-job.
  ops:
    container_name: raton-ops
    profiles: [ops]
    image: ${RATON_OPS_IMAGE:-raton-ops:local}
    build:
      context: .
      target: ops
    restart: unless-stopped
    ports:
      # Same interface as the app (APP_BIND): the page has no authentication.
      - "${APP_BIND:-127.0.0.1}:${PREVIEWS_PORT:-8999}:8999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The repository at its host path: the bind mounts of the compose files it runs are
      # resolved by the host's Docker, so both sides must agree on the path (OPS_REPO is set by the Makefile).
      - .:${OPS_REPO:-/project}
    environment:
      OPS_REPO: ${OPS_REPO:-}
      TZ: ${TZ:-Europe/Paris}
      # gh and git over HTTPS (previews, fetch of origin/main).
      GH_TOKEN: ${GH_TOKEN:-}
      # When set, the page asks for it as the password of HTTP Basic auth (any user name).
      OPS_TOKEN: ${OPS_TOKEN:-}

  # The monitoring container (`make monitoring`): the daily log review and its page. No Docker
  # socket. Behind a profile like `ops`, so that `make up` never recreates it mid-review.
  monitoring:
    container_name: raton-monitoring
    profiles: [monitoring]
    image: ${RATON_MONITORING_IMAGE:-raton-monitoring:local}
    build:
      context: .
      target: monitoring
    restart: unless-stopped
    ports:
      # Same interface as the app (APP_BIND): the page has no authentication by default.
      - "${APP_BIND:-127.0.0.1}:${MONITORING_PORT:-8998}:8998"
    volumes:
      - .:/project
      - ${LOG_HOST_DIR:-./.local/logs}:/var/log/raton:ro
    environment:
      MONITORING_REPO: /project
      LOG_DIR: /var/log/raton
      TZ: ${TZ:-Europe/Paris}
      # When set, the page asks for it as the password of HTTP Basic auth (any user name).
      MONITORING_TOKEN: ${MONITORING_TOKEN:-}
      # The daily log review: Claude Code on the Anthropic API, billed per token.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MONITORING_REVIEW_HOUR: ${MONITORING_REVIEW_HOUR:-8}
      MONITORING_REVIEW_MODEL: ${MONITORING_REVIEW_MODEL:-sonnet}
      MONITORING_REVIEW_MAX_USD: ${MONITORING_REVIEW_MAX_USD:-1}

volumes:
  postgres_data:
