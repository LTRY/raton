[metadata]
name = raton
version = 0.1.0
description = Local YouTube catalog and downloader

[options]
packages = find:
python_requires = >=3.14,<3.15
install_requires =
    alembic>=1.13.3
    apscheduler>=3.10.4
    fastapi>=0.115.0
    jinja2>=3.1.4
    psycopg[binary]>=3.2.1
    pydantic-settings>=2.5.2
    python-multipart>=0.0.9
    sqlalchemy>=2.0.35
    uvicorn[standard]>=0.30.6
    webvtt-py>=0.5.1
    yt-dlp>=2024.8.6

[options.extras_require]
dev =
    pytest>=8.3.3
